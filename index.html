<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colorful Telegram Mini App</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
        .glow-effect {
            animation: pulse-glow 3s infinite;
        }
    </style>
</head>
<body class="bg-slate-950 text-white font-sans min-h-screen flex flex-col justify-between selection:bg-pink-500 selection:text-white">

    <!-- Header / Banner Section with Vibrant Gradient -->
    <div class="relative overflow-hidden bg-gradient-to-r from-violet-600 via-fuchsia-600 to-pink-500 p-6 rounded-b-3xl shadow-2xl">
        <div class="absolute -right-10 -top-10 w-40 h-40 bg-white/10 rounded-full blur-2xl glow-effect"></div>
        <div class="relative z-10">
            <span class="bg-white/20 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider backdrop-blur-md">Premium Mini App</span>
            <h1 class="text-3xl font-extrabold mt-3 tracking-tight">✨ လန်းလန်းနဲ့အရောင်စုံ</h1>
            <p class="text-pink-100 text-sm mt-1">ငွေပေးချေမှုများကို ချောမွေ့မြန်ဆန်စွာ ပြုလုပ်နိုင်ပါပြီ။</p>
        </div>
    </div>

    <!-- Main Content Container -->
    <div class="px-4 py-6 flex-1 max-w-md w-full mx-auto space-y-4">
        
        <!-- Balance / Package Card -->
        <div class="bg-gradient-to-br from-slate-900 to-slate-900/80 border border-slate-800 p-5 rounded-2xl shadow-xl relative overflow-hidden">
            <div class="absolute top-0 right-0 w-32 h-32 bg-gradient-to-br from-cyan-500/10 to-blue-500/0 rounded-full blur-xl"></div>
            <div class="flex justify-between items-center">
                <div>
                    <p class="text-slate-400 text-xs font-medium uppercase">လက်ရှိလက်ကျန်</p>
                    <h3 id="user-balance" class="text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-emerald-400 mt-0.5">$ 0.00</h3>
                </div>
                <button onclick="topUpBalance()" class="bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white px-4 py-2 rounded-xl text-sm font-semibold shadow-lg shadow-emerald-900/30 transition-all active:scale-95">
                    + ငွေဖြည့်မည်
                </button>
            </div>
        </div>

        <!-- Pricing / Service Cards (Colorful Grid) -->
        <h2 class="text-sm font-bold text-slate-400 uppercase tracking-wider px-1">ရွေးချယ်စရာ ပက်ကေ့ဂျ်များ</h2>
        
        <div class="grid grid-cols-2 gap-3">
            <!-- Option 1 -->
            <div onclick="selectPackage('Starter', 5)" class="cursor-pointer bg-gradient-to-b from-purple-900/40 to-slate-900 border border-purple-500/30 hover:border-purple-500 p-4 rounded-2xl transition-all hover:scale-[1.02] active:scale-95 group">
                <div class="w-8 h-8 rounded-lg bg-purple-500/20 flex items-center justify-center text-purple-400 mb-3 group-hover:bg-purple-500 group-hover:text-white transition-colors">🚀</div>
                <h4 class="font-bold text-white">Starter</h4>
                <p class="text-xs text-purple-300 mt-0.5">အခြေခံသုံးစွဲရန်</p>
                <div class="mt-4 font-extrabold text-purple-400 text-lg">$5</div>
            </div>

            <!-- Option 2 -->
            <div onclick="selectPackage('Pro', 15)" class="cursor-pointer bg-gradient-to-b from-pink-900/40 to-slate-900 border border-pink-500/30 hover:border-pink-500 p-4 rounded-2xl transition-all hover:scale-[1.02] active:scale-95 group relative overflow-hidden">
                <div class="absolute -right-6 -top-6 w-16 h-16 bg-pink-500/20 rounded-full blur-md"></div>
                <div class="w-8 h-8 rounded-lg bg-pink-500/20 flex items-center justify-center text-pink-400 mb-3 group-hover:bg-pink-500 group-hover:text-white transition-colors">🔥</div>
                <h4 class="font-bold text-white">Pro Pass</h4>
                <p class="text-xs text-pink-300 mt-0.5">လူကြိုက်အများဆုံး</p>
                <div class="mt-4 font-extrabold text-pink-400 text-lg">$15</div>
            </div>
        </div>

    </div>

    <!-- Footer Action Area -->
    <div class="p-4 bg-slate-900/80 backdrop-blur-lg border-t border-slate-800 text-center">
        <p class="text-xs text-slate-500">Secure payments powered by Telegram & Supabase</p>
    </div>

    <!-- JavaScript Integration with Supabase -->
    <script>
        // Initialize Telegram Web App
        let tg = window.Telegram.WebApp;
        tg.expand();

        // Supabase Configuration (သင့်ရဲ့ Supabase Project က URL နဲ့ Anon Key ကို ထည့်ပါ)
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Telegram User ID ရယူရန် (Test လုပ်တဲ့အခါ Default ID တစ်ခုသုံးလို့ရပါတယ်)
        let telegramUser = tg.initDataUnsafe?.user || { id: 123456789, first_name: "TestUser" };

        let selectedPlan = { name: "Starter", price: 5 };

        // App စဖွင့်ချင်း Supabase ထဲမှာ User ရှိမရှိ စစ်ဆေးပြီး Data ယူမည်
        async function fetchUserData() {
            let { data, error } = await _supabase
                .from('users')
                .select('*')
                .eq('telegram_id', telegramUser.id)
                .single();

            if (data) {
                document.getElementById('user-balance').innerText = `$ ${data.balance.toFixed(2)}`;
            } else {
                // User အသစ်ဆိုရင် Supabase ထဲသို့ အလိုအလျောက် ထည့်မည်
                await _supabase.from('users').insert([
                    { telegram_id: telegramUser.id, username: telegramUser.first_name, balance: 0.00 }
                ]);
            }
        }

        fetchUserData();

        function selectPackage(name, price) {
            selectedPlan = { name, price };
            tg.HapticFeedback.selectionChanged();
            
            tg.MainButton.text = `${name} ဝယ်ယူရန် ($${price})`;
            tg.MainButton.color = "#8b5cf6";
            tg.MainButton.textColor = "#ffffff";
            tg.MainButton.show();
        }

        function topUpBalance() {
            tg.showAlert("ငွေဖြည့်သွင်းရန် Bot ထံသို့ လမ်းညွှန်ပေးပါမည်။");
        }

        Telegram.WebApp.onEvent('mainButtonClicked', async function() {
            // ဝယ်ယူမှုမှတ်တမ်းကို Supabase ရဲ့ purchases table ထဲသို့ သိမ်းမည်
            const { error } = await _supabase.from('purchases').insert([
                { telegram_id: telegramUser.id, package_name: selectedPlan.name, price: selectedPlan.price }
            ]);

            if (!error) {
                tg.sendData(JSON.stringify(selectedPlan));
                tg.showAlert(`အောင်မြင်ပါသည်။ ${selectedPlan.name} ($${selectedPlan.price}) ကို ဝယ်ယူပြီးပါပြီ။`);
            } else {
                tg.showAlert("ဝယ်ယူမှု အဆင်မပြေပါ။ ထပ်မံကြိုးစားပါ။");
            }
        });
    </script>
</body>
</html>
