<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHWELOTTERY WINGO</title>
    <style>
        body {
            background-color: #0b190f;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            position: relative;
            user-select: none;
            -webkit-user-select: none;
        }
        .top-right-bar {
            position: absolute;
            top: 15px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .group-btn {
            background-color: #0e2616;
            border: 1px solid #2ecc71;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            color: #2ecc71;
            text-decoration: none;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(46, 204, 113, 0.2);
            transition: 0.2s;
        }
        .group-btn:hover {
            background-color: #2ecc71;
            color: #0b190f;
        }
        .live-clock {
            background-color: #0e2616;
            border: 1px solid #2ecc71;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            color: #2ecc71;
            box-shadow: 0 0 10px rgba(46, 204, 113, 0.2);
            letter-spacing: 1px;
        }
        .container {
            background-color: #0e2616;
            border: 2px solid #2ecc71;
            box-shadow: 0 0 15px rgba(46, 204, 113, 0.4);
            padding: 20px;
            border-radius: 15px;
            width: 320px;
            text-align: center;
            margin-top: 30px;
        }
        h2 {
            color: #2ecc71;
            margin-bottom: 5px;
            font-size: 20px;
        }
        p {
            color: #82e0aa;
            font-size: 13px;
            margin-bottom: 15px;
        }
        .label-text {
            color: #82e0aa;
            font-size: 12px;
            margin-bottom: 5px;
            text-align: left;
        }
        .input-box {
            background-color: #07120a;
            border: 1px solid #2ecc71;
            padding: 12px;
            margin-bottom: 15px;
            font-size: 20px;
            letter-spacing: 5px;
            color: #2ecc71;
            border-radius: 8px;
            text-align: center;
        }
        .result-box {
            background-color: #123d1d;
            border: 1px solid #2ecc71;
            padding: 15px;
            margin: 15px 0;
            border-radius: 8px;
            min-height: 55px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        .key {
            background-color: #17452a;
            color: #fff;
            border: 1px solid #1f2a24;
            padding: 15px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        .key:active {
            background-color: #2ecc71;
            color: #000;
        }
        .btn-calculate {
            background: linear-gradient(to right, #27ae60, #2ecc71);
            color: white;
            border: none;
        }
        .btn-clear {
            background-color: #123d1d;
            border: 1px solid #2ecc71;
            color: #2ecc71;
        }
        .footer-text {
            margin-top: 15px;
            font-size: 11px;
            color: #57606f;
        }
        .admin-btn {
            display: inline-block;
            background-color: #2ecc71;
            color: #0b190f;
            padding: 8px 12px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            font-size: 13px;
            margin-top: 8px;
        }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(11, 25, 15, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            display: none;
        }
        .modal-content {
            background-color: #0e2616;
            border: 2px solid #2ecc71;
            padding: 20px;
            border-radius: 12px;
            width: 280px;
            text-align: center;
            box-shadow: 0 0 20px rgba(46, 204, 113, 0.3);
        }
        .modal-input {
            background-color: #07120a;
            border: 1px solid #2ecc71;
            color: #2ecc71;
            padding: 10px;
            font-size: 18px;
            width: 80%;
            text-align: center;
            border-radius: 6px;
            margin-bottom: 15px;
            letter-spacing: 3px;
        }
        .modal-btn-group {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }
