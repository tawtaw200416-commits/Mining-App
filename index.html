<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHWELOTTERY WINGO</title>
    <style>
        body {
            background-color: #0b190f;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            position: relative;
            user-select: none;
            -webkit-user-select: none;
        }
        .top-right-bar {
            position: absolute;
            top: 15px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .group-btn {
            background-color: #0e2616;
            border: 1px solid #2ecc71;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            color: #2ecc71;
            text-decoration: none;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(46, 204, 113, 0.2);
            transition: 0.2s;
        }
        .group-btn:hover {
            background-color: #2ecc71;
            color: #0b190f;
        }
        .live-clock {
            background-color: #0e2616;
            border: 1px solid #2ecc71;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            color: #2ecc71;
            box-shadow: 0 0 10px rgba(46, 204, 113, 0.2);
            letter-spacing: 1px;
        }
        .container {
            background-color: #0e2616;
            border: 2px solid #2ecc71;
            box-shadow: 0 0 15px rgba(46, 204, 113, 0.4);
            padding: 20px;
            border-radius: 15px;
            width: 320px;
            text-align: center;
            margin-top: 30px;
        }
        h2 {
            color: #2ecc71;
            margin-bottom: 5px;
            font-size: 20px;
        }
        p {
            color: #82e0aa;
            font-size: 13px;
            margin-bottom: 15px;
        }
        .label-text {
            color: #82e0aa;
            font-size: 12px;
            margin-bottom: 5px;
            text-align: left;
        }
        .input-box {
            background-color: #07120a;
            border: 1px solid #2ecc71;
            padding: 12px;
            margin-bottom: 15px;
            font-size: 20px;
            letter-spacing: 5px;
            color: #2ecc71;
            border-radius: 8px;
            text-align: center;
        }
        .result-box {
            background-color: #123d1d;
            border: 1px solid #2ecc71;
            padding: 15px;
            margin: 15px 0;
            border-radius: 8px;
            min-height: 55px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        .key {
            background-color: #17452a;
            color: #fff;
            border: 1px solid #1f2a24;
            padding: 15px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        .key:active {
            background-color: #2ecc71;
            color: #000;
        }
        .btn-calculate {
            background: linear-gradient(to right, #27ae60, #2ecc71);
            color: white;
            border: none;
        }
        .btn-clear {
            background-color: #123d1d;
            border: 1px solid #2ecc71;
            color: #2ecc71;
        }
        .footer-text {
            margin-top: 15px;
            font-size: 11px;
            color: #57606f;
        }
        .admin-btn {
            display: inline-block;
            background-color: #2ecc71;
            color: #0b190f;
            padding: 8px 12px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            font-size: 13px;
            margin-top: 8px;
        }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(11, 25, 15, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            display: none;
        }
        .modal-content {
            background-color: #0e2616;
            border: 2px solid #2ecc71;
            padding: 20px;
            border-radius: 12px;
            width: 280px;
            text-align: center;
            box-shadow: 0 0 20px rgba(46, 204, 113, 0.3);
        }
        .modal-input {
            background-color: #07120a;
            border: 1px solid #2ecc71;
            color: #2ecc71;
            padding: 10px;
            font-size: 18px;
            width: 80%;
            text-align: center;
            border-radius: 6px;
            margin-bottom: 15px;
            letter-spacing: 3px;
        }
        .modal-btn-group {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }
        .modal-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        .modal-btn-submit {
            background-color: #2ecc71;
            color: #0b190f;
        }
        .modal-btn-cancel {
            background-color: #123d1d;
            color: #2ecc71;
            border: 1px solid #2ecc71;
        }
        .spinner {
            border: 3px solid rgba(46, 204, 113, 0.2);
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border-left-color: #2ecc71;
            animation: spin 1s linear infinite;
            margin-bottom: 5px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body oncontextmenu="return false;">

<div class="top-right-bar">
    <a href="https://t.me/+6iY7D2rwWxAyZTZl" target="_blank" class="group-btn">BIGO Group</a>
    <div class="live-clock" id="mmClock">မြန်မာစံတော်ချိန်: --:--:--</div>
</div>

<div class="container" id="appContainer">
    <h2>SHWELOTTERY WINGO</h2>
    <p>နောက်ဆုံးထွက် ဂဏန်း ၅ လုံးကို ရိုက်ထည့်ပါ</p>
    
    <div class="label-text">ထည့်သွင်းထားသော ဂဏန်းများ (၅ လုံး)</div>
    <div class="input-box" id="display">- - - - -</div>
    
    <div class="result-box" id="resultArea">
        <span style="font-size: 14px; color: #fff;">ဂဏန်းများရိုက်ထည့်ပြီး "တွက်မည်" ကိုနှိပ်ပါ</span>
    </div>

    <div class="keypad">
        <button class="key" onclick="pressNum('1')">1</button>
        <button class="key" onclick="pressNum('2')">2</button>
        <button class="key" onclick="pressNum('3')">3</button>
        <button class="key" onclick="pressNum('4')">4</button>
        <button class="key" onclick="pressNum('5')">5</button>
        <button class="key" onclick="pressNum('6')">6</button>
        <button class="key" onclick="pressNum('7')">7</button>
        <button class="key" onclick="pressNum('8')">8</button>
        <button class="key" onclick="pressNum('9')">9</button>
        <button class="key btn-clear" onclick="clearNum()">ဖျက်ရန်</button>
        <button class="key" onclick="pressNum('0')">0</button>
        <button class="key btn-calculate" onclick="checkPinAndCalculate()">တွက်မည်</button>
    </div>

    <div class="footer-text">SHWELOTTERY WINGO © 2026 | ALL RIGHTS RESERVED</div>
</div>

<!-- PIN Modal -->
<div class="modal-overlay" id="pinModal">
    <div class="modal-content">
        <h3 style="color: #2ecc71; margin-top: 0; font-size: 16px;">🔐 PIN နံပါတ် လိုအပ်သည်</h3>
        <p style="font-size: 12px; color: #82e0aa; margin-bottom: 10px;">ကျေးဇူးပြု၍ PIN နံပါတ်ကို ထည့်ပါ</p>
        <input type="password" id="modalPinInput" class="modal-input" maxlength="10" placeholder="••••••">
        <div class="modal-btn-group">
            <button class="modal-btn modal-btn-cancel" onclick="closePinModal()">ပိတ်ရန်</button>
            <button class="modal-btn modal-btn-submit" onclick="submitPin()">အတည်ပြု</button>
        </div>
    </div>
</div>

<script>
    // F12၊ ညာကလစ်နှင့် ကုဒ်ခိုးယူမှု ကာကွယ်ရေး
    document.addEventListener('keydown', function(e) {
        if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) || (e.ctrlKey && e.key === 'U')) {
            e.preventDefault();
            alert("⚠️ ဤစနစ်တွင် ကုဒ်ခိုးယူခွင့် မပြုပါ။");
            return false;
        }
    });

    (function() {
        // ==========================================
        // 🔒 Telegram User ID စစ်ဆေးခြင်း
        // ==========================================
        const ALLOWED_IDS = ["1777769438", "1793453606", "KLAHS83"];
        
        window.addEventListener('DOMContentLoaded', () => {
            let webApp = window.Telegram && window.Telegram.WebApp;
            let isAuthorized = false;

            if (webApp && webApp.initDataUnsafe && webApp.initDataUnsafe.user) {
                let user = webApp.initDataUnsafe.user;
                let userId = String(user.id);
                let username = user.username ? String(user.username) : "";

                if (ALLOWED_IDS.includes(userId) || ALLOWED_IDS.includes(username)) {
                    isAuthorized = true;
                }
            }

            // အကယ်၍ ခွင့်ပြုချက်မရှိပါက (Browser မှလာခြင်း သို့မဟုတ် ID မမှန်ပါက) စာမျက်နှာကို လုံးဝပိတ်ပင်မည်
            if (!isAuthorized) {
                document.body.innerHTML = `
                    <div style="background-color: #0b190f; color: #2ecc71; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; text-align: center; padding: 20px;">
                        <div style="background-color: #0e2616; border: 2px solid #2ecc71; padding: 30px; border-radius: 15px; box-shadow: 0 0 20px rgba(46, 204, 113, 0.4); max-width: 320px;">
                            <h3 style="color: #ff4d4d; margin-top: 0;">⛔ ဝင်ရောက်ခွင့်မရှိပါ</h3>
                            <p style="font-size: 13px; color: #82e0aa; margin-bottom: 20px;">ဤစနစ်ကို အသုံးပြုခွင့် မရှိပါ။ Admin ထံသို့ ဆက်သွယ်ပါ။</p>
                            <a href="https://t.me/skybilly20" target="_blank" style="display: inline-block; background-color: #2ecc71; color: #0b190f; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 14px;">Admin ကို ဆက်သွယ်ရန် (@skybilly20)</a>
                        </div>
                    </div>
                `;
                return;
            }

            if (webApp && webApp.ready) {
                webApp.ready();
            }
        });

        const CORRECT_PIN = "000000"; 
        const PIN_STORAGE_KEY = "wingo_pin_verified_v115"; // Cache ရှောင်ရှားရန် ဗားရှင်းအသစ်

        function getMyanmarTime() {
            const now = new Date();
            const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            return new Date(utc + (3600000 * 6.5));
        }

        function updateMyanmarClock() {
            try {
                const mmTime = getMyanmarTime();
                let hours = mmTime.getHours();
                let minutes = mmTime.getMinutes();
                let seconds = mmTime.getSeconds();
                hours = hours < 10 ? '0' + hours : hours;
                minutes = minutes < 10 ? '0' + minutes : minutes;
                seconds = seconds < 10 ? '0' + seconds : seconds;
                let clockEl = document.getElementById("mmClock");
                if(clockEl) {
                    clockEl.innerText = `မြန်မာစံတော်ချိန်: ${hours}:${minutes}:${seconds}`;
                }
            } catch(e) {}
        }
        setInterval(updateMyanmarClock, 1000);
        updateMyanmarClock();

        let currentInput = "";

        window.pressNum = function(num) {
            if (currentInput.length < 5) {
                currentInput += num;
                window.updateDisplay();
            }
        };

        window.clearNum = function() {
            currentInput = "";
            window.updateDisplay();
            document.getElementById("resultArea").innerHTML = `<span style="font-size: 14px; color: #fff;">ဂဏန်းများရိုက်ထည့်ပြီး "တွက်မည်" ကိုနှိပ်ပါ</span>`;
        };

        window.updateDisplay = function() {
            let displayText = currentInput.padEnd(5, '_');
            document.getElementById("display").innerText = displayText.split("").join(' ');
        };

        window.checkPinAndCalculate = function() {
            if (currentInput.length !== 5) {
                alert("ကျေးဇူးပြု၍ ဂဏန်း ၅ လုံး အပြည့်ထည့်ပါ။");
                return;
            }

            let isVerified = localStorage.getItem(PIN_STORAGE_KEY) === "true";
            if (!isVerified) {
                document.getElementById("pinModal").style.display = "flex";
                document.getElementById("modalPinInput").value = "";
                document.getElementById("modalPinInput").focus();
            } else {
                window.executeCalculation();
            }
        };

        window.closePinModal = function() {
            document.getElementById("pinModal").style.display = "none";
        };

        window.submitPin = function() {
            let userPin = document.getElementById("modalPinInput").value;
            let resultBox = document.getElementById("resultArea");
            if (userPin === CORRECT_PIN) {
                localStorage.setItem(PIN_STORAGE_KEY, "true");
                window.closePinModal();
                window.executeCalculation();
            } else {
                window.closePinModal();
                resultBox.innerHTML = `
                    <span style="font-size: 13px; color: #2ecc71; text-align: center;">⚠️ PIN နံပါတ် မှားယွင်းနေပါသည်</span>
                    <a href="https://t.me/skybilly20" target="_blank" class="admin-btn">Admin ကို ဆက်သွယ်ရန် (@skybilly20)</a>
                `;
            }
        };

        window.executeCalculation = function() {
            let resultBox = document.getElementById("resultArea");
            let rawInput = currentInput;

            resultBox.innerHTML = `
                <div class="spinner"></div>
                <span style="font-size: 12px; color: #2ecc71;">⚡ တွက်ချက်နေပါသည်...</span>
            `;
            
            setTimeout(() => {
                // ==========================================
                // ⚙️ ရိုက်ထည့်လိုက်သော ၅ လုံးထဲမှ ဒုတိယအလုံးကို တိုက်ရိုက်ယူခြင်း
                // ==========================================
                let secondDigit = parseInt(rawInput.charAt(1), 10);
                
                let isBig = secondDigit >= 5;
                let resultType = isBig ? "BIG" : "SMALL";

                resultBox.innerHTML = `
                    <span style="font-size: 16px; color: #82e0aa; font-weight: bold;">🎯 ရလဒ် : ${resultType}</span>
                `;

                currentInput = "";
                window.updateDisplay();
            }, 300);
        };
    })();
</script>

</body>
</html>
